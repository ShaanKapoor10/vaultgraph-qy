version: "2.0"
name: "Brahmastra Concept Graph Ontology"
description: "Domain-agnostic semantic relation types for personal knowledge graphs"

entity_types:
  - name: "person"
    description: "Individual human"
  - name: "project"
    description: "Work initiative, product, or deliverable"
  - name: "concept"
    description: "Abstract idea, algorithm, pattern, or methodology"
  - name: "tool"
    description: "Programming language, framework, library, or software tool"
  - name: "organisation"
    description: "Team, company, or group"
  - name: "event"
    description: "Named occurrence or milestone"
  - name: "date"
    description: "Calendar date or date range"
  - name: "location"
    description: "Geographic place, region, or logical environment"
  - name: "feature"
    description: "Product capability or functional characteristic"
  - name: "file"
    description: "Source file, module, or document"
  - name: "status"
    description: "State value (e.g. complete, in progress, blocked)"
  - name: "unknown"
    description: "Entity whose type cannot be determined"

relations:
  - name: "owns"
    domain: ["person", "organisation"]
    range: ["project", "concept", "tool", "unknown"]
    functional: false
    description: "person or org owns/is responsible for project/tool/concept"
    examples:
      - "Shaan owns vaultgraph-qy"
      - "The platform team owns the auth service"

  - name: "created_by"
    domain: ["*"]
    range: ["person", "organisation"]
    functional: false
    description: "X was created or authored by a person/org"
    examples:
      - "Brahmastra was created by Shaan Kapoor"
      - "This architecture was designed by the core team"

  - name: "reports_to"
    domain: ["person"]
    range: ["person", "organisation"]
    functional: true
    description: "person's manager or reporting line"
    examples:
      - "Alice reports to Bob"

  - name: "works_on"
    domain: ["person", "organisation"]
    range: ["project", "concept", "tool", "feature"]
    functional: false
    description: "person or org is actively contributing to X"
    examples:
      - "Shaan works on the pipeline refactor"

  - name: "part_of"
    domain: ["*"]
    range: ["*"]
    functional: false
    description: "X is a sub-component or member of Y"
    examples:
      - "extraction.py is part of the Brahmastra backend"
      - "Louvain algorithm is part of the graph build stage"

  - name: "has_component"
    domain: ["project", "concept", "tool", "organisation"]
    range: ["*"]
    functional: false
    description: "X contains or is composed of Y (use when X is the whole)"
    examples:
      - "Brahmastra has_component FastAPI backend"
      - "The pipeline has_component entity resolution stage"

  - name: "depends_on"
    domain: ["*"]
    range: ["*"]
    functional: false
    description: "X requires Y to work; Y is a prerequisite"
    examples:
      - "graph build depends_on entity resolution"
      - "extraction depends_on GROQ_API_KEY"

  - name: "implements"
    domain: ["project", "person", "tool"]
    range: ["concept", "tool", "feature", "unknown"]
    functional: false
    description: "X implements a concept, standard, algorithm, or pattern"
    examples:
      - "entity_resolution.py implements Union-Find"
      - "Brahmastra implements knowledge graph"

  - name: "uses"
    domain: ["*"]
    range: ["*"]
    functional: false
    description: "X uses/utilises Y — use ONLY when no more specific relation fits"
    examples:
      - "Brahmastra uses NetworkX"

  - name: "provides"
    domain: ["project", "tool", "person", "organisation"]
    range: ["feature", "concept", "tool", "unknown"]
    functional: false
    description: "X exposes or offers Y as a capability or service"
    examples:
      - "Groq provides fast LLM inference"
      - "Brahmastra provides graph visualization"

  - name: "integrates_with"
    domain: ["project", "tool"]
    range: ["project", "tool", "unknown"]
    functional: false
    description: "X connects to or interfaces with Y"
    examples:
      - "Brahmastra integrates_with Notion"
      - "Next.js integrates_with FastAPI via rewrites"

  - name: "has_status"
    domain: ["*"]
    range: ["status", "concept", "unknown"]
    functional: true
    description: "X's current state (e.g. complete, in progress, blocked)"
    examples:
      - "auth migration has_status in progress"
      - "Brahmastra has_status production-ready"

  - name: "scheduled_for"
    domain: ["project", "event", "unknown"]
    range: ["date"]
    functional: true
    description: "X is planned for date Y"
    examples:
      - "release scheduled_for Q3 2025"

  - name: "located_in"
    domain: ["*"]
    range: ["location", "organisation", "unknown"]
    functional: true
    description: "X is physically or logically located/hosted in Y"
    examples:
      - "backend located_in Vercel"
      - "team located_in San Francisco"

  - name: "blocks"
    domain: ["project", "event", "concept", "unknown"]
    range: ["project", "event", "concept", "unknown"]
    functional: false
    description: "X prevents Y from progressing"
    examples:
      - "auth migration blocks search revamp"

  - name: "related_to"
    domain: ["*"]
    range: ["*"]
    functional: false
    description: "general topical link — use ONLY when no specific relation fits"
    examples:
      - "vector search related_to semantic similarity"

validation:
  confidence_threshold: 0.4
  allow_custom_relations: false
  entity_type_enforcement: "soft"
