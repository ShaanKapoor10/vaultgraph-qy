# A SEPARATE, COMPLETE Brahmastra for experiments -- branch exp/haiku-gateway.
#
# The same services as production (Postgres for notes, Neo4j for the graph, the
# API, the dashboard, the scheduler), with EVERY LLM call -- extraction, the
# merge judge, cluster summaries, /ask, meeting comprehension, checkpoints --
# answered by Claude Haiku through the Claude Code gateway on the host.
#
#   1. start the gateway (host):   python -m brahmastra.claude_gateway   (backend/, :8790)
#   2. start this stack:           docker compose -f docker-compose.test.yml up -d --build
#   3. the MCP twin:               "brahmastra-test" in the workspace .mcp.json
#
# Its own project name, ports, volumes and image names: nothing here can reach
# the production stack (Postgres :5433, Aura, Notion), and nothing is
# interpolated from .env -- every value is written out, so a production setting
# in the repo-root .env cannot leak in the way CLAUDE.md warns compose does.
#
#   dashboard  http://localhost:3001        API       http://localhost:8011
#   postgres   localhost:5434 (notes)       neo4j     bolt localhost:7688, browser :7475

name: brahmastra-test

x-test-env: &test-env
  # ---- storage: the same arrangement as production, on local engines ----
  NOTE_BACKEND: postgres
  GRAPH_BACKEND: neo4j
  POSTGRES_HOST: postgres-test
  POSTGRES_PORT: "5432"
  POSTGRES_USER: brahmastra
  POSTGRES_PASSWORD: brahmastra-test
  POSTGRES_DB: brahmastra_test
  NEO4J_URI: neo4j://neo4j-test:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: brahmastra-test
  NEO4J_ENCRYPTED: "0"
  BRAHMASTRA_DB: /data/concept_graph.db
  BRAHMASTRA_DATA_DIR: /data
  BRAHMASTRA_CHECKPOINT_DIR: /data/checkpoints
  BRAHMASTRA_WORKSPACE: default
  GRAPH_KEEPALIVE: "0"
  # ---- every LLM call: Claude Haiku through the host gateway -------------
  LLM_PROVIDER: gateway
  GATEWAY_MODEL: haiku
  CLAUDE_GATEWAY_URL: http://host.docker.internal:8790
  RESOLUTION_LLM_MODEL: gateway:haiku
  ENTITY_CONFIRM: "1"
  GROQ_API_KEY: ""
  GROQ_API_KEYS: ""
  # ---- nothing outward-facing --------------------------------------------
  NOTION_TOKEN: ""
  NOTION_DATABASE_ID: ""
  BRAHMASTRA_ALLOW_ANONYMOUS: "1"
  BRAHMASTRA_KEY_ADMIN: ""

services:
  postgres-test:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: brahmastra
      POSTGRES_PASSWORD: brahmastra-test
      POSTGRES_DB: brahmastra_test
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brahmastra -d brahmastra_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j-test:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/brahmastra-test
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - test-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p brahmastra-test 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  backend-test:
    build:
      context: ./backend
    image: brahmastra-backend-test
    restart: unless-stopped
    ports:
      - "8011:8001"
    depends_on:
      postgres-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
    environment: *test-env
    volumes:
      - test-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Runs the pipeline on a timer, like production's scheduler. No Notion here,
  # so each tick only extracts what is pending and rebuilds the graph.
  scheduler-test:
    image: brahmastra-backend-test
    restart: unless-stopped
    command: ["python", "-m", "brahmastra.live_sync"]
    healthcheck:
      disable: true
    depends_on:
      backend-test:
        condition: service_started
    environment:
      <<: *test-env
      POLL_INTERVAL: "300"
    volumes:
      - test-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend-test:
    build:
      context: ./frontend
    image: brahmastra-frontend-test
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend-test:8001
    depends_on:
      backend-test:
        condition: service_started

volumes:
  test-postgres-data:
  test-neo4j-data:
  test-data:
