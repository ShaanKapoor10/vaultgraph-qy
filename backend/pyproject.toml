[project]
name = "brahmastra-backend"
version = "0.1.0"
description = "Brahmastra Concept Graph Engine — Python backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "jellyfish>=1.0.1",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "notion-client>=2.2.1",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]
