# Brahmastra - full stack.
#
#   docker compose up --build
#   dashboard  http://localhost:3000
#   api        http://localhost:8001/health/ready
#
# The default arrangement separates the two kinds of data, because they are not
# owed the same care. Notes and workspaces are the SYSTEM OF RECORD: they cannot
# be recomputed, and they live in Postgres, which is networked (several machines,
# one source of truth) and supports hybrid search. Triples, clusters and the
# cached graph are a CACHE -- every one is a function of the notes, and
# run_pipeline(full=True) rebuilds them -- so they live in the Neo4j engine,
# which can be replaced or rebuilt without risking anything irreplaceable.
#
# Both backing services start by default. Gating either behind a profile while
# the backend defaults to it would ship a configuration pointing at something
# nobody started.
#
# To use Aura instead of the local engine, set NEO4J_URI / NEO4J_USER /
# NEO4J_PASSWORD (Aura's username is the instance id, not "neo4j") and skip the
# local container with `docker compose up --scale neo4j=0`.
#
# The single-store SQLite arrangement still works -- NOTE_BACKEND= and
# GRAPH_BACKEND=sqlite -- and is fine locally. It is not what to deploy: the
# system of record becomes one file on one container's disk, discarded on
# redeploy unless it is on a volume, invisible to a second instance, and
# lexical-only, so hybrid search silently degrades to substring matching.
# /health/ready warns when it finds that arrangement.

services:
  backend:
    build:
      context: ./backend
    image: brahmastra-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      # Wait for both stores to be ACCEPTING CONNECTIONS, not merely started.
      # A container that is up but still initialising fails the first call
      # against it: Postgres refuses the connection, and Neo4j -- which takes
      # roughly 40s to elect itself -- raises "Unable to retrieve routing
      # information" and takes the whole startup down with it.
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # ---- storage -------------------------------------------------------
      # One answer for every process. The MCP server, the CLI and the hooks
      # read this from backend/.env; inside the container it comes from here.
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      # Both paths point INTO the volume. A database written to the image
      # layer instead is discarded on the next deploy, silently.
      BRAHMASTRA_DB: /data/concept_graph.db
      BRAHMASTRA_CHECKPOINT_DIR: /data/checkpoints
      # Where the keepalive records that the engine was last touched.
      # On the shared volume so a pipeline run here and the keepalive
      # container agree, instead of each keeping its own answer and
      # querying a remote instance the other touched minutes ago.
      BRAHMASTRA_DATA_DIR: /data
      BRAHMASTRA_WORKSPACE: ${BRAHMASTRA_WORKSPACE:-default}

      # ---- the system of record -------------------------------------------
      # Deployed default. Notes live in Postgres and the graph in Neo4j, so
      # choosing or rebuilding an engine never risks irreplaceable data.
      # Override to empty for the single-store arrangement, which is still
      # supported but is NOT what a deployment should run: a SQLite system of
      # record is one file on one container's disk, and its search is lexical.
      NOTE_BACKEND: ${NOTE_BACKEND:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-brahmastra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brahmastra}
      POSTGRES_DB: ${POSTGRES_DB:-brahmastra}

      # ---- neo4j (ignored when GRAPH_BACKEND=sqlite) ----------------------
      # Defaults to the service beside it, so `up` yields a working stack.
      # Aura users override all three; note Aura's username is the instance id,
      # not "neo4j", and the URI must be bare neo4j:// -- the +s schemes lock
      # TLS config and forbid the certifi context this machine needs.
      NEO4J_URI: ${NEO4J_URI:-neo4j://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-brahmastra}
      # Empty means "infer from the host", which is the behaviour every
      # service already had. Forwarded so that an explicit override in
      # .env reaches the container instead of being silently dropped.
      NEO4J_ENCRYPTED: ${NEO4J_ENCRYPTED:-}

      # ---- language model ------------------------------------------------
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Reaches the host's Ollama from inside the container; a bare localhost
      # here would resolve to the container itself and always fail.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

      # ---- notion (optional) ---------------------------------------------
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}

      # ---- web -----------------------------------------------------------
      # Lock this down before exposing the API publicly.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # ---- authentication ------------------------------------------------
      # Fails closed: with neither of these set the API returns 503 on every
      # route except the health probes, so a misconfigured deployment breaks
      # loudly instead of publishing the graph.
      BRAHMASTRA_API_KEY: ${BRAHMASTRA_API_KEY:-}
      BRAHMASTRA_ALLOW_ANONYMOUS: ${BRAHMASTRA_ALLOW_ANONYMOUS:-}

      # Serve MCP over HTTP at /mcp, behind the same auth as the REST API.
      # Off by default: a local stdio MCP server needs none of this.
      MCP_HTTP: ${MCP_HTTP:-}
      # SQLite is a single file; concurrent writers give "database is locked".
      # Raise this ONLY with GRAPH_BACKEND=neo4j.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      # The only stateful thing in the deployment. Lose this and you lose the
      # notes, which are the one part of the system that is not rebuildable.
      - brahmastra-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    image: brahmastra-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Service name, not localhost: inside the compose network "localhost"
      # is the frontend container itself.
      BACKEND_URL: http://backend:8001
      # The dashboard proxies /api/* to a backend that may now require a key.
      BRAHMASTRA_API_KEY: ${BRAHMASTRA_API_KEY:-}
    depends_on:
      backend:
        # service_STARTED, not service_healthy. The backend's health check is
        # /health/ready, which reports 503 while the graph engine is down --
        # correctly, since it cannot serve graph traffic. Gating the dashboard
        # on that made a suspended Aura stop the frontend from starting at all,
        # which is the same cascade as the backend crash loop one level up.
        #
        # The dashboard already degrades on its own: it renders seed data and
        # shows a "seed data" badge when the backend does not answer. A
        # degraded dashboard beats no dashboard, and with the notes in Postgres
        # most of it works regardless.
        condition: service_started

  # Runs the pipeline on a timer. Opt in:
  #   docker compose --profile scheduler up --build
  #
  # It used to be off because of the storage choice: with GRAPH_BACKEND=sqlite
  # this is a SECOND WRITER against one file, and while the pipeline lock stops
  # two runs overlapping, it does not stop a long transaction making an API
  # write wait on busy_timeout.
  #
  # That constraint is GONE in the default arrangement — notes in Postgres, the
  # graph in Neo4j, both fine with concurrent writers. Still opt-in for one
  # remaining reason, which is outward-facing rather than technical: each tick
  # pulls from Notion AND the pipeline's write-back stage pushes pages to it, so
  # turning this on means a process editing your Notion every POLL_INTERVAL.
  scheduler:
    profiles: ["scheduler"]
    build:
      context: ./backend
    image: brahmastra-backend
    restart: unless-stopped
    command: ["python", "-m", "brahmastra.live_sync"]
    # The image's HEALTHCHECK curls /health/ready, which is right for the one
    # service that serves HTTP and wrong for every other use of the same image.
    # This container never opens a port, so it reported "unhealthy" for hours
    # while working perfectly -- and `depends_on: service_healthy` would have
    # waited on it forever.
    healthcheck:
      disable: true
    environment:
      POLL_INTERVAL: ${POLL_INTERVAL:-900}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      BRAHMASTRA_DB: /data/concept_graph.db
      BRAHMASTRA_CHECKPOINT_DIR: /data/checkpoints
      # Where the keepalive records that the engine was last touched.
      # On the shared volume so a pipeline run here and the keepalive
      # container agree, instead of each keeping its own answer and
      # querying a remote instance the other touched minutes ago.
      BRAHMASTRA_DATA_DIR: /data
      BRAHMASTRA_WORKSPACE: ${BRAHMASTRA_WORKSPACE:-default}
      NOTE_BACKEND: ${NOTE_BACKEND:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-brahmastra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brahmastra}
      POSTGRES_DB: ${POSTGRES_DB:-brahmastra}
      # Defaults to the service beside it, so `up` yields a working stack.
      # Aura users override all three; note Aura's username is the instance id,
      # not "neo4j", and the URI must be bare neo4j:// -- the +s schemes lock
      # TLS config and forbid the certifi context this machine needs.
      NEO4J_URI: ${NEO4J_URI:-neo4j://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-brahmastra}
      # Empty means "infer from the host", which is the behaviour every
      # service already had. Forwarded so that an explicit override in
      # .env reaches the container instead of being silently dropped.
      NEO4J_ENCRYPTED: ${NEO4J_ENCRYPTED:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      # It never serves HTTP, so it needs no API key of its own.
      BRAHMASTRA_ALLOW_ANONYMOUS: "1"
    volumes:
      - brahmastra-data:/data
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # Stops a remote graph engine idling out of existence.
  #
  # Neo4j Aura Free suspends an instance after roughly three days without a
  # query, and a suspended instance stops RESOLVING -- so the failure arrives
  # as a DNS error that reads like a typo in NEO4J_URI. Nothing else prevents
  # it: the scheduler's idle check is a note read, answered entirely by
  # Postgres, so that loop can tick for a week without sending Neo4j anything.
  #
  # Unlike the scheduler this has NO profile and no opt-in, because it has no
  # outward-facing side effect at all -- it reads counts and writes nothing,
  # touches no Notion page and spends no LLM tokens. There is nothing to weigh.
  #
  # NOTE_BACKEND is deliberately absent. With it set this would build a
  # composite and need Postgres reachable at construction, which would make an
  # unrelated outage the reason Aura went to sleep.
  keepalive:
    build:
      context: ./backend
    image: brahmastra-backend
    restart: unless-stopped
    command: ["python", "-m", "brahmastra.keepalive", "--loop"]
    # Same reason as the scheduler: this serves no HTTP, so the image's
    # /health/ready probe would mark a perfectly working container unhealthy.
    healthcheck:
      disable: true
    environment:
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      NEO4J_URI: ${NEO4J_URI:-neo4j://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-brahmastra}
      # Empty means "infer from the host", which is the behaviour every
      # service already had. Forwarded so that an explicit override in
      # .env reaches the container instead of being silently dropped.
      NEO4J_ENCRYPTED: ${NEO4J_ENCRYPTED:-}
      BRAHMASTRA_WORKSPACE: ${BRAHMASTRA_WORKSPACE:-default}
      GRAPH_KEEPALIVE_HOURS: ${GRAPH_KEEPALIVE_HOURS:-12}
      # The shared volume, so a pipeline run and this container agree on when
      # the engine was last touched instead of each keeping its own answer.
      BRAHMASTRA_DATA_DIR: /data
      BRAHMASTRA_ALLOW_ANONYMOUS: "1"
    volumes:
      - brahmastra-data:/data
    # No depends_on: the point is to be the thing that is still trying when
    # something else is down, and a health gate on a local neo4j would block
    # startup for a deployment whose NEO4J_URI names Aura instead.

  # The system of record (NOTE_BACKEND=postgres, the deployed default).
  #
  # pgvector/pgvector, NOT the stock postgres image. The `vector` extension is
  # what keeps hybrid search alive after the notes move off Neo4j, and a stock
  # build does not ship it -- the Windows installer offers only pg_trgm. Without
  # it PostgresStore still stores notes but reports itself lexical-only, and
  # CompositeStore refuses it rather than degrading search invisibly.
  postgres:
    # No profile: this is the system of record in the default arrangement, so
    # `docker compose up` must bring it with everything else. Gating it behind
    # a profile while the backend defaults to NOTE_BACKEND=postgres would ship
    # a default configuration that points at a service nobody started.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      # Published so migrations and the MCP server can reach it from the host.
      #
      # 5433, not 5432, because a native PostgreSQL install takes 5432 and
      # Windows lets BOTH processes bind 0.0.0.0:5432 without an error. The
      # first binder wins, so Docker's mapping becomes a silent no-op: the
      # containers still talk over the compose network and look perfectly
      # healthy, while anything on the host that connects to localhost:5432
      # reaches the OTHER database -- one with no pgvector and none of your
      # notes. Nothing anywhere reports a conflict.
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brahmastra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brahmastra}
      POSTGRES_DB: ${POSTGRES_DB:-brahmastra}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The system of record must be accepting connections before anything
      # tries to write a note to it.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brahmastra} -d ${POSTGRES_DB:-brahmastra}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The graph engine. Not profiled, for the same reason postgres is not: the
  # backend defaults to GRAPH_BACKEND=neo4j, so gating this would ship a
  # default configuration pointing at an engine nobody started -- `up` would
  # resolve NEO4J_URI to the empty string and fail on the first graph call.
  #
  # Point NEO4J_URI at Aura to use the hosted instance instead; this service
  # then just idles, or skip it with `docker compose up --scale neo4j=0`.
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      # NEO4J_LOCAL_PASSWORD, not NEO4J_PASSWORD. The two were briefly unified
      # and it broke the moment NEO4J_URI pointed at Aura: NEO4J_PASSWORD then
      # holds the AURA credential, the healthcheck below tried to log into this
      # container with it, the container went unhealthy, and the backend --
      # which does not even use this container in that arrangement -- refused
      # to start behind its depends_on. A remote credential and a local one are
      # different facts and need different names.
      NEO4J_AUTH: neo4j/${NEO4J_LOCAL_PASSWORD:-brahmastra}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      # Probes BOLT, not the browser on 7474. HTTP answers well before Bolt is
      # serving, so the old check reported healthy while the driver still got
      # "Unable to retrieve routing information" -- and because the backend
      # gates on this, it started too early and died. Running an actual query
      # also proves auth is initialised, which a port check cannot.
      #
      # The password is interpolated by COMPOSE (single $), not read from the
      # container's environment. The neo4j image turns every NEO4J_* variable
      # into a server config setting, so passing NEO4J_PASSWORD in produced an
      # unrecognised setting named PASSWORD and the server refused to boot at
      # all -- a healthcheck that prevented the thing it was checking.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_LOCAL_PASSWORD:-brahmastra} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

volumes:
  brahmastra-data:
  neo4j-data:
  postgres-data:
